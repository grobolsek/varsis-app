# Production add-on: Caddy in front of the app, with a Let's Encrypt certificate for DOMAIN (set it in .env).
# Use it together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
# Before the first start: DOMAIN's DNS record points at this server, and ports 80 and 443 are open.
services:
  caddy:
    build: ../caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80" # certificate checks and the redirect to https
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:-/varsis}/caddy:/data # certificates; losing them means asking Let's Encrypt again (rate limited)
    depends_on: [frontend]

  frontend:
    ports: !reset [] # plain http is only reachable through Caddy

  backend:
    environment:
      APP_URL: https://${DOMAIN} # email links and the cookie's Secure flag
