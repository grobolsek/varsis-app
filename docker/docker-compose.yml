# Run in this folder, with your settings in .env next to this file (cp ../../.env.example .env). See README.md.
# All data lives in folders under DATA_DIR (default /varsis): postgres, music, covers.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: varsis
      # Only used when the database volume is first created. To change it later, also run
      # ALTER USER varsis PASSWORD '...' in the database.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: varsis
    volumes: ["${DATA_DIR:-/varsis}/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varsis"]
      interval: 5s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://varsis:${POSTGRES_PASSWORD}@db:5432/varsis
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ${DATA_DIR:-/varsis}/music:/music
      - ${DATA_DIR:-/varsis}/covers:/covers
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s

  frontend:
    build: ../frontend
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    depends_on: [backend]

  # Development only: catches every email the app sends and shows it on http://localhost:8025.
  # It has a profile, so a plain `docker compose up` (production) doesn't start it.
  mailpit:
    image: axllent/mailpit:v1.33.0
    profiles: [dev]
    restart: unless-stopped
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

